name: Linux packages

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deb:
    runs-on: ubuntu-24.04
    container:
      image: invent-registry.kde.org/neon/docker-images/plasma:user
      options: --user 0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y build-essential debhelper cmake ninja-build extra-cmake-modules pkg-config qt6-base-dev qt6-base-private-dev qt6-declarative-dev qt6-wayland-dev libkf6config-dev libkf6coreaddons-dev libkf6dbusaddons-dev libkf6globalaccel-dev libkf6guiaddons-dev libkf6i18n-dev libkf6iconthemes-dev libkf6kio-dev libkf6notifications-dev libkf6prison-dev libkf6service-dev kf6-kstatusnotifieritem-dev libkf6widgetsaddons-dev libkf6windowsystem-dev libkf6xmlgui-dev libplasma-dev plasma-wayland-protocols libwayland-dev libxcb-xfixes0-dev libxcb-cursor-dev libei-dev zlib1g-dev dpkg-dev
      - name: Build deb with debhelper
        run: |
          cp -a packaging/debian debian
          dpkg-buildpackage -us -uc -b
          mkdir -p dist
          cp ../klipboard_*.deb dist/
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: deb
          path: 'dist/*.deb'

  rpm:
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install build dependencies
        run: dnf install -y git cmake ninja-build extra-cmake-modules gcc-c++ qt6-qtbase-devel qt6-qtbase-private-devel qt6-qtdeclarative-devel qt6-qtwayland-devel kf6-kconfig-devel kf6-kcoreaddons-devel kf6-kdbusaddons-devel kf6-kglobalaccel-devel kf6-kguiaddons-devel kf6-ki18n-devel kf6-kiconthemes-devel kf6-kio-devel kf6-knotifications-devel kf6-prison-devel kf6-kservice-devel kf6-kstatusnotifieritem-devel kf6-kwidgetsaddons-devel kf6-kwindowsystem-devel kf6-kxmlgui-devel libplasma-devel plasma-wayland-protocols-devel wayland-devel libei-devel xcb-util-devel zlib-devel rpm-build
      - name: Build rpm
        run: |
          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner --exclude=./rpmbuild --transform='s,^\./,klipboard-6.8.2/,' -czf rpmbuild/SOURCES/klipboard-6.8.2.tar.gz .
          rpmbuild --define "_topdir $PWD/rpmbuild" -bb packaging/rpm/klipboard.spec
          for rpm in rpmbuild/RPMS/*/*.rpm; do cp "$rpm" .; done
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: rpm
          path: '*.rpm'

  arch:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build package
        run: |
          pacman -Syu --noconfirm --needed git sudo cmake ninja extra-cmake-modules qt6-base qt6-declarative qt6-wayland qt6-tools plasma-wayland-protocols libei libxcb xcb-util zlib ki18n kconfig kcoreaddons kdbusaddons kglobalaccel kguiaddons kiconthemes kio knotifications prison kservice kstatusnotifieritem kwidgetsaddons kwindowsystem kxmlgui libplasma
          useradd -m builder
          printf 'builder ALL=(ALL) NOPASSWD: ALL\n' >> /etc/sudoers
          cp -a "$GITHUB_WORKSPACE" /tmp/klipboard
          cp /tmp/klipboard/packaging/arch/PKGBUILD /tmp/klipboard/PKGBUILD
          chown -R builder:builder /tmp/klipboard
          cd /tmp/klipboard
          su builder -c 'makepkg --noconfirm'
          cp ./*.pkg.tar.zst "$GITHUB_WORKSPACE/"
          pacman -U --noconfirm ./*.pkg.tar.zst
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: arch
          path: '*.pkg.tar.zst'
